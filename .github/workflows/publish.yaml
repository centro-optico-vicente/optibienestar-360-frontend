name: CI/CD — Build & Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'Nginx version to use as base image'
        required: false
        default: '1.31.0'

env:
  DOCKER_HUB_REGISTRY: ${{ vars.DOCKER_HUB_REGISTRY || 'docker.io' }}
  DOCKER_HUB_REPOSITORY: ${{ vars.DOCKER_HUB_REPOSITORY || format('{0}/optibienestar-360-frontend', vars.DOCKER_HUB_USERNAME) }}
  NGINX_VERSION: ${{ github.event.inputs.nginx_version || vars.NGINX_VERSION || '1.31.0' }}

jobs:
  build-and-test:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate static SPA
        run: pnpm generate


  # Verify secrets before attempting Docker Hub push
  check-secrets-dhr:
    name: Check if Docker Hub registry information was set on secrets
    needs:
      - build-and-test
    runs-on: ubuntu-latest
    outputs:
      is_have_secrets: ${{ steps.check_secret_job.outputs.is_have_secrets }}
    steps:
      - id: check_secret_job
        run: |
          if [[ "${{ vars.DOCKER_HUB_USERNAME }}" != "" && \
                "${{ secrets.DOCKER_HUB_TOKEN }}" != "" ]]; \
          then
            echo "Secrets/Variables to use a container registry are configured in the repo"
            echo "is_have_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets/Variables to use a container registry were not configured in the repo"
            echo "is_have_secrets=false" >> $GITHUB_OUTPUT
          fi


  push-alpine-image-dhr:
    name: Build and push Docker Alpine image
    needs:
      - check-secrets-dhr
    if: needs.check-secrets-dhr.outputs.is_have_secrets == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Push to docker repository
        run: echo "Pushing to Docker repository ${{ env.DOCKER_HUB_REPOSITORY }} alpine"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker metadata (Alpine)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=-alpine
            type=raw,value=alpine,enable=${{ !github.event.release.prerelease }}

      - name: Build and Push Docker Alpine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/alpine.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            BUILD_VERSION=${{ github.event.release.tag_name || github.ref_name }}
            BUILD_DATE=${{ github.event.release.published_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-alpine
          cache-to: type=gha,mode=max,scope=docker-alpine


