name: CI — Build & Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.ai/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.ai/**'
      - 'LICENSE'
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGINX_VERSION: ${{ vars.NGINX_VERSION || '1.31.8' }}

jobs:

  build-and-test:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 22 with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Zero-dependency script: fails fast before the install if es/en drift apart.
      - name: Check i18n key parity (es/en)
        run: node scripts/check-i18n-parity.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate static SPA
        run: pnpm generate

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-output
          path: .output/public/
          retention-days: 3

  # Only after the code build passes: check whether anything that affects the
  # Docker image changed in this ref. Skipped if build-and-test failed.
  changes:
    name: Detect Docker-related changes
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.github/workflows/ci.yaml'

  # Validate both Dockerfiles build and the SPA actually serves. No images are pushed.
  # Only runs when Docker-related files change (Dockerfiles, nginx conf, entrypoint
  # scripts, this workflow); pure source changes are already covered by Typecheck & Build.
  docker-smoke:
    name: Validate image & smoke test (${{ matrix.flavor }})
    needs: 
      - changes
      - build-and-test
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - alpine
          # - debian

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/${{ matrix.flavor }}.Dockerfile
          push: false
          load: true
          tags: optibienestar-360-frontend:ci-${{ matrix.flavor }}
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            BUILD_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.flavor }}

      - name: Start container
        run: |
          docker run -d --name spa \
            -e NUXT_PUBLIC_API_BASE_URL=https://api.example.test \
            -p 18080:80 optibienestar-360-frontend:ci-${{ matrix.flavor }}
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:18080/ > /dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke test — index renders the Nuxt app
        run: |
          body=$(curl -sf http://127.0.0.1:18080/)
          echo "$body" | grep -qE '<div id="__nuxt"|/_nuxt/' \
            || { echo "::error::Index did not return the Nuxt app shell"; echo "$body" | head -40; exit 1; }

      - name: Smoke test — runtime config injected from env
        run: |
          cfg=$(curl -sf http://127.0.0.1:18080/config.js)
          echo "$cfg"
          echo "$cfg" | grep -qF 'https://api.example.test' \
            || { echo "::error::/config.js did not pick up NUXT_PUBLIC_API_BASE_URL"; exit 1; }
          curl -sI http://127.0.0.1:18080/config.js | grep -qi "cache-control: no-store" \
            || { echo "::error::/config.js must be served with no-store"; exit 1; }

      - name: Smoke test — SPA fallback for client-side routes
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/login)
          [ "$code" = "200" ] \
            || { echo "::error::Client route /login did not fall back to index.html (got $code)"; exit 1; }

      - name: Smoke test — old public URLs 301 to the Spanish ones, keeping the query
        run: |
          headers=$(curl -sI 'http://127.0.0.1:18080/reset-password?token=abc123')
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 301' \
            || { echo "::error::/reset-password did not answer 301"; exit 1; }
          for path in reset-password restablecer-contrasena 'restablecer-contrase%C3%B1a' reestablecer-clave; do
            curl -sI "http://127.0.0.1:18080/$path?token=abc123" | grep -qi '^location: /restablecer-clave?token=abc123' \
              || { echo "::error::/$path did not redirect to /restablecer-clave keeping ?token="; exit 1; }
          done
          for path in recover-password recuperar-contrasena 'recuperar-contrase%C3%B1a'; do
            curl -sI "http://127.0.0.1:18080/$path" | grep -qi '^location: /recuperar-clave' \
              || { echo "::error::/$path did not redirect to /recuperar-clave"; exit 1; }
          done
          for path in restablecer-clave recuperar-clave; do
            curl -sI "http://127.0.0.1:18080/$path" | head -1 | grep -q ' 200' \
              || { echo "::error::/$path must not redirect"; exit 1; }
          done

      - name: Smoke test — English pairs of the public URLs serve the SPA (200, no redirect)
        run: |
          for path in en en/allies en/allies/00000000-0000-0000-0000-000000000000 'en/join?ref=ABC123' \
            en/forgot-password 'en/reset-password?token=x' 'afiliarse?ref=ABC123'; do
            headers=$(curl -sI "http://127.0.0.1:18080/$path")
            echo "$headers" | head -1 | grep -q ' 200' \
              || { echo "::error::/$path must answer 200"; echo "$headers"; exit 1; }
            if echo "$headers" | grep -qi '^location:'; then
              echo "::error::/$path must not redirect"; echo "$headers"; exit 1
            fi
          done
          body=$(curl -sf 'http://127.0.0.1:18080/en/reset-password?token=x')
          echo "$body" | grep -qE '<div id="__nuxt"|/_nuxt/' \
            || { echo "::error::/en/reset-password did not return the Nuxt app shell"; exit 1; }

      - name: Smoke test — old portal URLs 301 to the English plural ones
        run: |
          headers=$(curl -sI 'http://127.0.0.1:18080/aliado/validator?q=1')
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 301' \
            || { echo "::error::/aliado/validator did not answer 301"; exit 1; }
          echo "$headers" | grep -qi '^location: /allies/validator?q=1' \
            || { echo "::error::/aliado/validator did not redirect to /allies/validator keeping the query"; exit 1; }
          curl -sI http://127.0.0.1:18080/promotor/cartera | grep -qi '^location: /advisors/portfolio' \
            || { echo "::error::/promotor/cartera did not redirect to /advisors/portfolio"; exit 1; }
          curl -sI http://127.0.0.1:18080/afiliado | grep -qi '^location: /members' \
            || { echo "::error::/afiliado did not redirect to /members"; exit 1; }
          for path in aliados allies; do
            curl -sI "http://127.0.0.1:18080/$path" | head -1 | grep -q ' 200' \
              || { echo "::error::/$path must not redirect"; exit 1; }
          done

      - name: Smoke test — old promoter admin URLs 301 to the advisor ones
        run: |
          headers=$(curl -sI 'http://127.0.0.1:18080/dashboard/promoters/x?y=1')
          echo "$headers"
          echo "$headers" | head -1 | grep -q ' 301' \
            || { echo "::error::/dashboard/promoters/x did not answer 301"; exit 1; }
          echo "$headers" | grep -qi '^location: /dashboard/advisors/x?y=1' \
            || { echo "::error::/dashboard/promoters/x did not redirect to /dashboard/advisors/x keeping the query"; exit 1; }
          curl -sI http://127.0.0.1:18080/dashboard/promoters | grep -qi '^location: /dashboard/advisors' \
            || { echo "::error::/dashboard/promoters did not redirect to /dashboard/advisors"; exit 1; }
          curl -sI 'http://127.0.0.1:18080/dashboard/catalogs/promoter-ranks?edit=1' | grep -qi '^location: /dashboard/catalogs/advisor-ranks?edit=1' \
            || { echo "::error::/dashboard/catalogs/promoter-ranks did not redirect to /dashboard/catalogs/advisor-ranks keeping the query"; exit 1; }
          curl -sI http://127.0.0.1:18080/dashboard/catalogs/promoter-types | grep -qi '^location: /dashboard/catalogs/advisor-types' \
            || { echo "::error::/dashboard/catalogs/promoter-types did not redirect to /dashboard/catalogs/advisor-types"; exit 1; }
          for path in dashboard/advisors dashboard/advisors/x dashboard/catalogs/advisor-types; do
            curl -sI "http://127.0.0.1:18080/$path" | head -1 | grep -q ' 200' \
              || { echo "::error::/$path must not redirect"; exit 1; }
          done

      - name: Stop container
        if: always()
        run: docker rm -f spa || true
