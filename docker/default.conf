server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types
		text/plain
		text/css
		text/javascript
		text/xml
		application/javascript
		application/json
		application/manifest+json
		application/wasm
		application/xml
		application/xml+rss
		application/atom+xml
		image/svg+xml;

	keepalive_requests 1000;

	# XSS mitigation (hub ADR 0024). style-src/script-src need 'unsafe-inline' for
	# Nuxt UI/Tailwind's dynamic inline styles — the app has no inline <script>
	# (SPA mode, /config.js is loaded as an external src, not inline). Google
	# Fonts (app.head in nuxt.config.ts) needs its own style-src/font-src entries.
	# connect-src/img-src stay open to any https: origin: NUXT_PUBLIC_API_BASE_URL
	# is injected at runtime (local/staging/prod all differ) and R2 presigned
	# download URLs live on a separate domain.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

	# Runtime configuration injected at container start. Must never be cached so a
	# redeploy with a different NUXT_PUBLIC_API_BASE_URL takes effect immediately.
	location = /config.js {
		default_type application/javascript;
		add_header Cache-Control "no-store" always;
	}

	# Hashed Nuxt build output: content-addressed filenames → cache immutable 1 year.
	location /_nuxt/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
		try_files $uri =404;
		open_file_cache max=1000 inactive=1h;
		open_file_cache_valid 1h;
		open_file_cache_min_uses 1;
		open_file_cache_errors on;
	}

	# HTML always revalidated against origin (304 when unchanged).
	location ~* \.html$ {
		add_header Cache-Control "no-cache" always;
	}

	# Don't emit absolute redirects: behind Traefik the upstream port leaks into
	# Location otherwise. Combined with the try_files below we avoid the trailing
	# slash redirect entirely.
	absolute_redirect off;

	# SPA: serve the static file, then the prerendered page (/login -> login/index.html),
	# otherwise fall back to index.html so client-side routes (/dashboard/:id, ...) resolve.
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri.html $uri/index.html /index.html;
	}
}
